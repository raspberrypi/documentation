name: Build and deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
      url:
        type: string
      deploy:
        type: boolean
        default: false

jobs:
  build:
    runs-on: [self-hosted, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14
      - name: Install Python dependencies
        run: |
          pip3 install --upgrade pip setuptools wheel
          pip3 install -r ./requirements.txt
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: 3.2
          bundler-cache: true
      - name: Install Ninja
        run: pip3 install ninja==1.10.2.4
      - name: Install arm-none-eabi-gcc GNU Arm Embedded Toolchain
        if: ${{ inputs.deploy }}
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1.13.0
      - name: Install Doxygen
        if: ${{ inputs.deploy }}
        run: |
          wget https://www.doxygen.nl/files/doxygen-1.10.0.linux.bin.tar.gz
          if echo 'dcfc9aa4cc05aef1f0407817612ad9e9201d9bf2ce67cecf95a024bba7d39747  doxygen-1.10.0.linux.bin.tar.gz' | sha256sum --check --status
          then
            tar xf doxygen-1.10.0.linux.bin.tar.gz -C "$HOME"
            echo "$HOME/doxygen-1.10.0/bin" >> $GITHUB_PATH
          fi
      - name: Build Doxygen documentation
        if: ${{ inputs.deploy }}
        run: make build_doxygen_adoc
      - name: Build documentation
        run: make -j 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.deploy }}
        with:
          name: documentation
          path: documentation/html/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  deploy:
    needs: build
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation
          path: documentation/html
      - name: Deploy to Mythic Beasts
        uses: $/.github/actions/deploy-action
        with:
          private_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          bastion_host: ${{ secrets.DEPLOY_BASTION_HOST }}
          primary_host: ${{ secrets.DEPLOY_PRIMARY_HOST }}
          secondary_host: ${{ secrets.DEPLOY_SECONDARY_HOST }}
          source: documentation/html/
          destination: /
