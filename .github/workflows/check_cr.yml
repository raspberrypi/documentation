name: Check line endings

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-line-endings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check line endings
        run: |
          scripts/check_line_endings.py

