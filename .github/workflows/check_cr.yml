name: Check line endings

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-line-endings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check line endings
        run: |
          scripts/check_line_endings.py

