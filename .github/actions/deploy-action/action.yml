name: Deploy via Bastion Host
description: "Deploy specified files and directories to a primary and secondary server via a bastion host"
inputs:
  private_ssh_key:
    description: "The private SSH key used to authenticate with the remote servers"
    required: true

  known_hosts:
    description: "The public SSH host keys for the bastion, primary and secondary servers"
    required: true

  bastion_host:
    description: "The [user@]hostname of the bastion server"
    required: true

  primary_host:
    description: "The [user@]hostname of the primary web server"
    required: true

  secondary_host:
    description: "The [user@]hostname of the secondary web server"
    required: true

  source:
    description: "The files and directories to copy from the workspace"
    required: true

  destination:
    description: "The destination to copy the source files and directories to"
    required: true

runs:
  using: "composite"
  steps:
    - name: Start ssh-agent with SSH key
      env:
        SSH_AUTH_SOCK: ${{ runner.temp }}/ssh_agent.sock
        PRIVATE_SSH_KEY: ${{ inputs.private_ssh_key }}
      run: |
        ssh-agent -a "$SSH_AUTH_SOCK"
        ssh-add - <<< "$PRIVATE_SSH_KEY"
      shell: bash

    - name: Populate known hosts
      env:
        KNOWN_HOSTS: ${{ inputs.known_hosts }}
      run: |
        mkdir -m 700 -p ~/.ssh
        printf "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts
      shell: bash

    - name: Deploy to primary server
      env:
        SSH_AUTH_SOCK: ${{ runner.temp }}/ssh_agent.sock
        BASTION_HOST: ${{ inputs.bastion_host }}
        HOST: ${{ inputs.primary_host }}
        SOURCE: ${{ inputs.source }}
        DESTINATION: ${{ inputs.destination }}
      run: rsync -avz --delete -e "ssh -J $BASTION_HOST" "$SOURCE" "$HOST:$DESTINATION"
      shell: bash

    - name: Deploy to secondary server
      env:
        SSH_AUTH_SOCK: ${{ runner.temp }}/ssh_agent.sock
        BASTION_HOST: ${{ inputs.bastion_host }}
        HOST: ${{ inputs.secondary_host }}
        SOURCE: ${{ inputs.source }}
        DESTINATION: ${{ inputs.destination }}
      run: rsync -avz --delete -e "ssh -J $BASTION_HOST" "$SOURCE" "$HOST:$DESTINATION"
      shell: bash
